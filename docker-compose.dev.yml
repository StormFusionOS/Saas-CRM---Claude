# ==============================================================================
# Docker Compose Configuration for LOCAL DEVELOPMENT
# ==============================================================================
# This file extends docker-compose.yml with development-specific overrides.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml down
#
# Or use the Makefile:
#   make dev-up       # Start all services
#   make dev-down     # Stop all services
#   make dev-logs     # View logs
#   make dev-rebuild  # Rebuild and restart
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # CRM Database (Development)
  # ----------------------------------------------------------------------------
  crm-db:
    environment:
      POSTGRES_DB: ${CRM_DB_NAME:-crm_dev}
      POSTGRES_USER: ${CRM_DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-crm_dev_password}
    ports:
      - "${CRM_DB_PORT:-5433}:5432"

  # ----------------------------------------------------------------------------
  # Ops Database (Development)
  # ----------------------------------------------------------------------------
  ops-db:
    environment:
      POSTGRES_DB: ${OPS_DB_NAME:-ops_dev}
      POSTGRES_USER: ${OPS_DB_USER:-ops_user}
      POSTGRES_PASSWORD: ${OPS_DB_PASSWORD:-ops_dev_password}
    ports:
      - "${OPS_DB_PORT:-5434}:5432"

  # ----------------------------------------------------------------------------
  # CRM API Backend (Development with Hot-Reload)
  # ----------------------------------------------------------------------------
  crm-api:
    build:
      context: ./crm_api
      dockerfile: Dockerfile.dev  # Uses dev dockerfile with hot-reload
    container_name: crm-api-dev
    environment:
      - SECRET_KEY=${CRM_SECRET_KEY:-dev-secret-key-change-in-prod}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${CRM_ACCESS_TOKEN_EXPIRE:-3600}
      - CRM_CORS_ORIGINS=${CRM_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://192.168.0.220:5173}
      - DEBUG=true
      - CRM_DB_HOST=crm-db
      - CRM_DB_PORT=5432
      - CRM_DB_NAME=${CRM_DB_NAME:-crm_dev}
      - CRM_DB_USER=${CRM_DB_USER:-crm_user}
      - CRM_DB_PASSWORD=${CRM_DB_PASSWORD:-crm_dev_password}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./crm_api:/app  # Mount source code for hot-reload
      - /app/__pycache__  # Exclude pycache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${CRM_API_PORT:-8000}:8000"
    restart: "no"  # Don't auto-restart in dev mode

  # ----------------------------------------------------------------------------
  # Ops API Backend (Development with Hot-Reload)
  # ----------------------------------------------------------------------------
  ops-api:
    build:
      context: ./ops_api
      dockerfile: Dockerfile.dev  # Uses dev dockerfile with hot-reload
    container_name: ops-api-dev
    environment:
      - SECRET_KEY=${OPS_SECRET_KEY:-dev-secret-key-change-in-prod}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${OPS_ACCESS_TOKEN_EXPIRE:-3600}
      - CORS_ORIGINS=${OPS_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      - DEBUG=true
      - OPS_DB_HOST=ops-db
      - OPS_DB_PORT=5432
      - OPS_DB_NAME=${OPS_DB_NAME:-ops_dev}
      - OPS_DB_USER=${OPS_DB_USER:-ops_user}
      - OPS_DB_PASSWORD=${OPS_DB_PASSWORD:-ops_dev_password}
    volumes:
      - ./ops_api:/app  # Mount source code for hot-reload
      - /app/__pycache__  # Exclude pycache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${OPS_API_PORT:-8001}:8001"
    restart: "no"  # Don't auto-restart in dev mode

  # ----------------------------------------------------------------------------
  # Celery Worker (Development)
  # ----------------------------------------------------------------------------
  celery-worker:
    container_name: celery-worker-dev
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://${CRM_DB_USER:-crm_user}:${CRM_DB_PASSWORD:-crm_dev_password}@crm-db:5432/${CRM_DB_NAME:-crm_dev}
      - QDRANT_URL=http://qdrant:6333
      - DEBUG=true
    volumes:
      - ./crm_api:/app  # Mount source code for hot-reload
    command: celery -A app.celery_app worker --loglevel=debug --concurrency=2 --queues=default,ai,governance,scraper,serp
    restart: "no"

  # ----------------------------------------------------------------------------
  # Celery Beat (Development)
  # ----------------------------------------------------------------------------
  celery-beat:
    container_name: celery-beat-dev
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://${CRM_DB_USER:-crm_user}:${CRM_DB_PASSWORD:-crm_dev_password}@crm-db:5432/${CRM_DB_NAME:-crm_dev}
      - DEBUG=true
    volumes:
      - ./crm_api:/app  # Mount source code for hot-reload
    restart: "no"

  # ----------------------------------------------------------------------------
  # Optional: CRM Frontend Dev Server (Vite)
  # ----------------------------------------------------------------------------
  # Uncomment to run frontend in Docker (usually run natively with npm run dev)
  # crm-frontend:
  #   build:
  #     context: ./crm
  #     dockerfile: Dockerfile.dev
  #   container_name: crm-frontend-dev
  #   environment:
  #     - VITE_CRM_API_URL=http://localhost:8000/api/v1
  #   volumes:
  #     - ./crm:/app
  #     - /app/node_modules
  #   ports:
  #     - "5173:5173"
  #   command: npm run dev -- --host 0.0.0.0
  #   restart: "no"

  # ----------------------------------------------------------------------------
  # Optional: Ops Frontend Dev Server (Vite)
  # ----------------------------------------------------------------------------
  # Uncomment to run frontend in Docker (usually run natively with npm run dev)
  # ops-frontend:
  #   build:
  #     context: ./ops-console
  #     dockerfile: Dockerfile.dev
  #   container_name: ops-frontend-dev
  #   environment:
  #     - VITE_OPS_API_URL=http://localhost:8001/api/v1
  #   volumes:
  #     - ./ops-console:/app
  #     - /app/node_modules
  #   ports:
  #     - "5174:5174"
  #   command: npm run dev -- --host 0.0.0.0
  #   restart: "no"

  # ----------------------------------------------------------------------------
  # Optional: Adminer (Database GUI)
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: crm-db
    networks:
      - app-network
    restart: "no"

  # ----------------------------------------------------------------------------
  # Optional: RedisInsight (Redis GUI)
  # ----------------------------------------------------------------------------
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8081:8001"
    volumes:
      - redis-insight-data:/db
    networks:
      - app-network
    restart: "no"

# ==============================================================================
# Additional Volumes for Dev Tools
# ==============================================================================
volumes:
  redis-insight-data:
    driver: local
