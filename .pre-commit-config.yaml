# ==============================================================================
# PRE-COMMIT HOOKS CONFIGURATION
# ==============================================================================
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Note: When using stub packages for offline dev, some hooks may need adjustment.
# In production with real packages, uncomment and configure as needed.
# ==============================================================================

repos:
  # ------------------------------------------------------------------------------
  # General file checks
  # ------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--safe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: check-executables-have-shebangs

  # ------------------------------------------------------------------------------
  # Python formatting and linting
  # ------------------------------------------------------------------------------
  # Uncomment when using real packages in production:
  #
  # - repo: https://github.com/psf/black
  #   rev: 24.1.1
  #   hooks:
  #     - id: black
  #       language_version: python3.11
  #       args: [--line-length=100]
  #
  # - repo: https://github.com/charliermarsh/ruff-pre-commit
  #   rev: v0.2.0
  #   hooks:
  #     - id: ruff
  #       args: [--fix, --exit-non-zero-on-fix]
  #
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-all]
  #       args: [--ignore-missing-imports, --no-strict-optional]

  # ------------------------------------------------------------------------------
  # JavaScript/TypeScript formatting
  # ------------------------------------------------------------------------------
  # Uncomment for frontend linting:
  #
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v8.56.0
  #   hooks:
  #     - id: eslint
  #       files: \.(js|jsx|ts|tsx)$
  #       types: [file]
  #       additional_dependencies:
  #         - eslint@8.56.0
  #         - eslint-config-prettier
  #         - eslint-plugin-react
  #         - eslint-plugin-react-hooks
  #
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v3.1.0
  #   hooks:
  #     - id: prettier
  #       files: \.(js|jsx|ts|tsx|json|css|scss|md|yml|yaml)$

  # ------------------------------------------------------------------------------
  # Security scanning
  # ------------------------------------------------------------------------------
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.7
  #   hooks:
  #     - id: bandit
  #       args: [-c, pyproject.toml, -r, crm_api/, ops_api/]
  #       additional_dependencies: ["bandit[toml]"]

  # ------------------------------------------------------------------------------
  # Secrets detection
  # ------------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

# ==============================================================================
# Configuration for specific tools
# ==============================================================================

# Black configuration (add to pyproject.toml in production)
# [tool.black]
# line-length = 100
# target-version = ['py311']
# include = '\.pyi?$'

# Ruff configuration (add to pyproject.toml in production)
# [tool.ruff]
# line-length = 100
# target-version = "py311"
# select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLW", "RUF"]
# ignore = ["E501", "S101"]  # Line too long, assert usage in tests

