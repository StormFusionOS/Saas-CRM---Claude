name: Python Backend CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [crm_api, ops_api]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies for ${{ matrix.service }}
      run: |
        cd ${{ matrix.service }}
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage for ${{ matrix.service }}
      run: |
        cd ${{ matrix.service }}
        pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --cov-report=html

    - name: Check coverage threshold (80%)
      run: |
        cd ${{ matrix.service }}
        COVERAGE=$(pytest tests/ --cov=app --cov-report=term | grep "TOTAL" | awk '{print $4}' | sed 's/%//')
        echo "Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "❌ Coverage $COVERAGE% is below 80% threshold"
          exit 1
        fi
        echo "✅ Coverage $COVERAGE% meets 80% threshold"

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-${{ matrix.service }}
        path: ${{ matrix.service }}/htmlcov/
        retention-days: 30

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v3
      with:
        files: ${{ matrix.service }}/coverage.xml
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}-coverage
        fail_ci_if_error: false

  security-tests:
    runs-on: ubuntu-latest
    needs: test-backends

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install CRM dependencies
      run: |
        cd crm_api
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run CRM cross-role security tests
      run: |
        cd crm_api
        pytest tests/test_cross_role_security.py -v

    - name: Install Ops dependencies
      run: |
        cd ops_api
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ops cross-role security tests
      run: |
        cd ops_api
        pytest tests/test_cross_role_security.py -v

    - name: Run Nginx hardening validation tests
      run: |
        cd ops_api
        pytest tests/test_hardening_script.py -v
