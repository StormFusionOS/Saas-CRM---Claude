name: Frontend CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: [crm, ops-console]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.frontend }}/package-lock.json

    - name: Install dependencies for ${{ matrix.frontend }}
      run: |
        cd ${{ matrix.frontend }}
        npm ci

    - name: Run TypeScript type checking
      run: |
        cd ${{ matrix.frontend }}
        npx tsc --noEmit

    - name: Run tests for ${{ matrix.frontend }}
      run: |
        cd ${{ matrix.frontend }}
        npm test -- --run --reporter=verbose

    - name: Build production bundle
      run: |
        cd ${{ matrix.frontend }}
        npm run build

    - name: Check build artifacts
      run: |
        cd ${{ matrix.frontend }}
        if [ ! -d "dist" ]; then
          echo "❌ Build failed: dist/ directory not found"
          exit 1
        fi
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Build failed: dist/index.html not found"
          exit 1
        fi
        echo "✅ Build successful"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.frontend }}-build
        path: ${{ matrix.frontend }}/dist/
        retention-days: 7

  lint-frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: [crm, ops-console]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.frontend }}/package-lock.json

    - name: Install dependencies for ${{ matrix.frontend }}
      run: |
        cd ${{ matrix.frontend }}
        npm ci

    - name: Run ESLint
      run: |
        cd ${{ matrix.frontend }}
        npx eslint . --ext .ts,.tsx --max-warnings=0
      continue-on-error: true

  build-summary:
    runs-on: ubuntu-latest
    needs: [test-frontends, lint-frontends]

    steps:
    - name: CI Summary
      run: |
        echo "## ✅ All Frontend Checks Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- TypeScript compilation: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Production builds: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Linting: ✅" >> $GITHUB_STEP_SUMMARY
