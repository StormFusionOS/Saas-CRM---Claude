# ==============================================================================
# Docker Compose Configuration for Production-Ready Monorepo
# ==============================================================================
# Services: PostgreSQL (CRM & Ops), Redis, Nginx (optional)
#
# Usage:
#   docker-compose up -d              # Start services
#   docker-compose ps                 # Check status
#   docker-compose logs -f service    # View logs
#   docker-compose down               # Stop services
#   docker-compose down -v            # Stop and remove volumes
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # CRM Database
  # ----------------------------------------------------------------------------
  crm-db:
    image: postgres:15-alpine
    container_name: crm-db
    environment:
      POSTGRES_DB: ${CRM_DB_NAME:-crm}
      POSTGRES_USER: ${CRM_DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-crm_password}
    ports:
      - "5433:5432"
    volumes:
      - crm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRM_DB_USER:-crm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Ops Database
  # ----------------------------------------------------------------------------
  ops-db:
    image: postgres:15-alpine
    container_name: ops-db
    environment:
      POSTGRES_DB: ${OPS_DB_NAME:-ops}
      POSTGRES_USER: ${OPS_DB_USER:-ops_user}
      POSTGRES_PASSWORD: ${OPS_DB_PASSWORD:-ops_password}
    ports:
      - "5434:5432"
    volumes:
      - ops-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPS_DB_USER:-ops_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Redis (for Celery & caching)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Qdrant (Vector Database for RAG & Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"  # HTTP API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Optional: Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  # Uncomment to run Nginx in Docker
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./crm/dist:/var/www/crm:ro
  #     - ./ops-console/dist:/var/www/ops:ro
  #   depends_on:
  #     - crm-api
  #     - ops-api
  #   networks:
  #     - app-network

  # ----------------------------------------------------------------------------
  # CRM API Backend
  # ----------------------------------------------------------------------------
  crm-api:
    build:
      context: ./crm_api
      dockerfile: Dockerfile
    container_name: crm-api
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${ACCESS_TOKEN_EXPIRE_SECONDS:-3600}
      - CRM_CORS_ORIGINS=${CRM_CORS_ORIGINS:-http://localhost:5173,http://192.168.0.220:5173,http://localhost:80}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      crm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Ops API Backend
  # ----------------------------------------------------------------------------
  ops-api:
    build:
      context: ./ops_api
      dockerfile: Dockerfile
    container_name: ops-api
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${ACCESS_TOKEN_EXPIRE_SECONDS:-3600}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5174,http://localhost:80}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8001:8001"
    depends_on:
      ops-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Celery Worker (AI Automation Tasks)
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./crm_api
      dockerfile: Dockerfile
    container_name: celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=default,ai,governance,scraper,serp
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://crm_user:crm_password@crm-db:5432/crm
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      crm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Celery Beat (Task Scheduler)
  # ----------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./crm_api
      dockerfile: Dockerfile
    container_name: celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://crm_user:crm_password@crm-db:5432/crm
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

# ==============================================================================
# Networks
# ==============================================================================
networks:
  app-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  crm-db-data:
    driver: local
  ops-db-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local
