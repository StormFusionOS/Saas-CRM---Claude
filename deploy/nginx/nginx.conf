# ==============================================================================
# Production-Ready Nginx Configuration
# ==============================================================================
# Hardened reverse proxy with CSP, origin enforcement, and security headers.
#
# Features:
#   - Separate server blocks for CRM and Ops domains
#   - Origin-based access control (CRM cannot call Ops API, vice versa)
#   - Content Security Policy (CSP)
#   - Rate limiting
#   - Security headers (HSTS, X-Frame-Options, etc.)
#   - Gzip compression
#   - Static file caching
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=120r/m;

    # Security headers (applied to all)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===========================================================================
    # CRM Frontend & API
    # ===========================================================================
    server {
        listen 80;
        server_name crm.example.com;

        # Redirect to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Content Security Policy for CRM
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:8000 https://crm.example.com;" always;

        # Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Root for SPA
        root /var/www/crm;
        index index.html;

        # Static files
        location / {
            limit_req zone=web_limit burst=20 nodelay;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # CRM API proxy
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            # Origin enforcement: Only allow CRM origin
            set $cors_origin "";
            if ($http_origin ~* "^https?://crm\.example\.com$") {
                set $cors_origin $http_origin;
            }
            if ($http_origin ~* "^http://localhost:5173$") {
                set $cors_origin $http_origin;
            }

            # Block if origin doesn't match
            if ($cors_origin = "") {
                return 403 "Forbidden: Invalid origin";
            }

            # Proxy to CRM API backend
            proxy_pass http://localhost:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $cors_origin;

            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    # ===========================================================================
    # Ops Console Frontend & API
    # ===========================================================================
    server {
        listen 80;
        server_name ops.example.com;

        # Redirect to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Content Security Policy for Ops
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:8001 https://ops.example.com;" always;

        # Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Root for SPA
        root /var/www/ops;
        index index.html;

        # Static files
        location / {
            limit_req zone=web_limit burst=20 nodelay;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Ops API proxy
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            # Origin enforcement: Only allow Ops origin
            set $cors_origin "";
            if ($http_origin ~* "^https?://ops\.example\.com$") {
                set $cors_origin $http_origin;
            }
            if ($http_origin ~* "^http://localhost:5174$") {
                set $cors_origin $http_origin;
            }

            # Block if origin doesn't match
            if ($cors_origin = "") {
                return 403 "Forbidden: Invalid origin";
            }

            # Proxy to Ops API backend
            proxy_pass http://localhost:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $cors_origin;

            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    # ===========================================================================
    # Health check endpoint (no auth required)
    # ===========================================================================
    server {
        listen 8080;
        server_name _;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
